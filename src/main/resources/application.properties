spring.application.name=trader

telegram.token=${telegram_tkn}
floki.key=${FLOKI_API_KEY}

spring.datasource.url=jdbc:mysql://localhost:3306/currency_data
spring.datasource.username=${MYSQL_U}
spring.datasource.password=${MYSQL_PWD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

management.endpoints.web.exposure.include=*

logging.level.root=INFO
logging.level.com.mycompany.crypto=DEBUG

logging.file.path=logs
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
